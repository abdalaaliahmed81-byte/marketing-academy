name: Verify desktop and web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/check-source.mjs
      - run: node scripts/audit-dependencies.mjs
      - run: npm run audit:project
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose up -d --build
      - run: node scripts/docker-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-evidence
          path: |
            artifacts
            playwright-report
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:win
      - name: Test built portable EXE, SQLite migration and restart persistence
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:DESKTOP_EXE = "release/Marketing-Academy-$version-win-x64.exe"
          node scripts/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA256, architecture verification and source archive
        run: node scripts/release-files.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-build-and-evidence
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            artifacts
          retention-days: 14
