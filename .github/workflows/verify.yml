name: Verify desktop and web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/check-source.mjs
      - run: node scripts/audit-dependencies.mjs
      - run: npm run audit:project
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose up -d --build
      - run: node scripts/docker-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-evidence
          path: |
            artifacts
            playwright-report
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:win
      - name: Test built portable EXE, SQLite migration and restart persistence
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:DESKTOP_EXE = "release/Marketing-Academy-$version-win-x64.exe"
          node scripts/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA256, architecture verification and source archive
        run: node scripts/release-files.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-build-and-evidence
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            artifacts
          retention-days: 14
  publish-preview:
    needs: [web, windows]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: publish verified Marketing Academy preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read artifacts from this successful verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name windows-build-and-evidence --dir verified
          gh run download "$GITHUB_RUN_ID" --name web-evidence --dir verified-web
          cd verified/release
          sha256sum --check SHA256SUMS.txt
      - name: Validate preview evidence
        env:
          RELEASE_CHANNEL: preview
          VERIFY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/release-proof.mjs
          cd verified/release
          sha256sum --check SHA256SUMS.txt
      - name: Publish explicitly requested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" verified/release/Marketing-Academy-${VERSION}-win-x64.exe verified/release/Marketing-Academy-${VERSION}-source.zip verified/release/SHA256SUMS.txt verified/release/verification.json --target "$GITHUB_SHA" --title "Marketing Academy ${VERSION} — Preview" --notes-file docs/RELEASE-NOTES.md --prerelease --latest=false
      - name: Download published assets and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "v${VERSION}" --dir public-readback
          cd public-readback
          sha256sum --check SHA256SUMS.txt
          cd ..
          mkdir -p artifacts
          gh release view "v${VERSION}" --json url,isDraft,isPrerelease,targetCommitish,assets > artifacts/published-preview.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict'
          const release=JSON.parse(fs.readFileSync('artifacts/published-preview.json','utf8'))
          assert.equal(release.isDraft,false);assert.equal(release.isPrerelease,true);assert.equal(release.targetCommitish,process.env.GITHUB_SHA)
          assert.equal(release.assets.length,4)
          const proof=JSON.parse(fs.readFileSync('public-readback/verification.json','utf8'))
          assert.equal(proof.commit,process.env.GITHUB_SHA);assert.equal(proof.releaseChannel,'preview')
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-publication-evidence
          path: |
            artifacts/published-preview.json
            public-readback/verification.json
            public-readback/SHA256SUMS.txt
          retention-days: 14
